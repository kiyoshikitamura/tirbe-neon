name: TN-01 Preview migration

on:
  push:
    branches:
      - codex/tn01-activation-lifecycle
    paths:
      - .github/workflows/tn01-preview-migration.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: tn01-preview-migration-sufvuqdnqohpfzkwxohq
  cancel-in-progress: false

jobs:
  apply-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PREVIEW_PROJECT_REF: sufvuqdnqohpfzkwxohq
      SUPABASE_EXPECTED_PROJECT_REF: sufvuqdnqohpfzkwxohq
      PRODUCTION_PROJECT_REF: ktpolnkyyfkowxdmijww
      MIGRATION_VERSION: "20260902000221"
      MIGRATION_FILE: supabase/migrations/20260902000221_activation_membership_mission_handoff.sql
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Guard secrets and exact Preview target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "SUPABASE_DB_PASSWORD is missing"; exit 1; }
          test "$SUPABASE_PREVIEW_PROJECT_REF" = "sufvuqdnqohpfzkwxohq"
          test "$SUPABASE_EXPECTED_PROJECT_REF" = "sufvuqdnqohpfzkwxohq"
          test "$SUPABASE_EXPECTED_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          test "$GITHUB_REF_NAME" = "codex/tn01-activation-lifecycle"

      - name: Publish guarded migration pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"pending\",\"context\":\"tn01-preview-migration\",\"description\":\"Guarded Preview migration is running\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"

      - run: npm ci --ignore-scripts

      - name: Link exact Preview project
        env:
          SUPABASE_TELEMETRY_DISABLED: "1"
        run: |
          supabase link \
            --project-ref "$SUPABASE_EXPECTED_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Confirm guarded Preview mutation
        run: node scripts/supabase_target_guard.mjs --environment preview --mutation

      - name: Read-only preflight, apply 00221, register, and verify contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFile } = require("node:fs/promises");
          const assert = require("node:assert/strict");

          const previewRef = process.env.SUPABASE_EXPECTED_PROJECT_REF;
          const productionRef = process.env.PRODUCTION_PROJECT_REF;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const version = process.env.MIGRATION_VERSION;
          const migrationFile = process.env.MIGRATION_FILE;
          assert.equal(previewRef, "sufvuqdnqohpfzkwxohq");
          assert.notEqual(previewRef, productionRef);
          assert.ok(token);

          async function query(sql) {
            const response = await fetch(`https://api.supabase.com/v1/projects/${previewRef}/database/query`, {
              method: "POST",
              headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
              body: JSON.stringify({ query: sql }),
            });
            if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
            return response.json();
          }

          const auditSql = `
            select jsonb_build_object(
              'migration_registered', exists(
                select 1 from supabase_migrations.schema_migrations where version = '${version}'
              ),
              'migration_columns', (
                select jsonb_agg(column_name order by ordinal_position)
                from information_schema.columns
                where table_schema = 'supabase_migrations' and table_name = 'schema_migrations'
              ),
              'guild_members_exists', to_regclass('public.guild_members') is not null,
              'function_exists', to_regprocedure('public.complete_activation_mission_handoff()') is not null,
              'function_definition', case
                when to_regprocedure('public.complete_activation_mission_handoff()') is null then null
                else pg_get_functiondef('public.complete_activation_mission_handoff()'::regprocedure)
              end
            ) audit;
          `;
          const [preflightRow] = await query(auditSql);
          const preflight = preflightRow.audit;
          console.log(JSON.stringify({ stage: "preflight", ...preflight }, null, 2));
          assert.equal(preflight.guild_members_exists, true, "guild_members authority table is missing");
          for (const required of ["version", "statements", "name"]) {
            assert.ok(preflight.migration_columns.includes(required), `schema_migrations.${required} is missing`);
          }

          if (!preflight.migration_registered) {
            const migrationSql = await readFile(migrationFile, "utf8");
            await query(migrationSql);
            await query(`
              insert into supabase_migrations.schema_migrations(version, statements, name)
              values (
                '${version}',
                array['TN-01 membership-only activation Mission handoff'],
                'activation_membership_mission_handoff'
              )
              on conflict (version) do nothing;
            `);
            console.log(`Applied and registered migration ${version} on Preview ${previewRef}.`);
          } else {
            console.log(`Migration ${version} was already registered; mutation skipped.`);
          }

          const [postflightRow] = await query(`
            select
              exists(select 1 from supabase_migrations.schema_migrations where version = '${version}') as migration_registered,
              to_regprocedure('public.complete_activation_mission_handoff()') is not null as function_exists,
              p.prosecdef as security_definer,
              has_function_privilege('authenticated', p.oid, 'EXECUTE') as authenticated_execute,
              not has_function_privilege('anon', p.oid, 'EXECUTE') as anon_rejected,
              position('=X/' in coalesce(array_to_string(p.proacl, ','), '')) = 0 as public_rejected,
              position('auth.uid()' in lower(pg_get_functiondef(p.oid))) > 0 as caller_scoped,
              position('public.guild_members' in lower(pg_get_functiondef(p.oid))) > 0 as membership_required,
              position('activation_mission_handoff' in lower(pg_get_functiondef(p.oid))) > 0 as handoff_recorded,
              position('on conflict' in lower(pg_get_functiondef(p.oid))) > 0 as idempotent,
              position('guild_activation' in lower(pg_get_functiondef(p.oid))) = 0 as legacy_gate_absent
            from pg_proc p
            where p.oid = 'public.complete_activation_mission_handoff()'::regprocedure;
          `);
          assert.ok(postflightRow, "postflight function row is missing");
          for (const [key, value] of Object.entries(postflightRow)) {
            assert.equal(value, true, `${key} contract failed`);
          }
          console.log(JSON.stringify({ stage: "postflight", project_ref: previewRef, version, ...postflightRow }, null, 2));
          NODE

      - name: Publish guarded migration result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="failure"
          description="Guarded Preview migration failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="00221 applied and contract verified on Preview"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"$state\",\"context\":\"tn01-preview-migration\",\"description\":\"$description\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
