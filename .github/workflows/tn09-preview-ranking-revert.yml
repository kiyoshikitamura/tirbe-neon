name: TN-09 Preview ranking lifecycle safety revert

on:
  push:
    branches: [codex/tn09-raid-ranking-complete]
    paths:
      - .github/workflows/tn09-preview-ranking-revert.yml

permissions:
  contents: read

concurrency:
  group: tn09-preview-ranking-revert-sufvuqdnqohpfzkwxohq
  cancel-in-progress: false

jobs:
  revert-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_EXPECTED_PROJECT_REF: sufvuqdnqohpfzkwxohq
      PRODUCTION_PROJECT_REF: ktpolnkyyfkowxdmijww
      MIGRATION_VERSION: "20260902000228"
      MIGRATION_FILE: supabase/migrations/20260902000228_ranking_season_lifecycle_revert.sql
      POSTFLIGHT_FILE: supabase/postflight/20260902000228_ranking_season_lifecycle_revert_postflight.sql
      FIXTURE_FILE: tests/db/ranking-season-lifecycle-revert.sql
    steps:
      - uses: actions/checkout@v4
      - name: Guard exact Preview target and apply audited correction
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test "$SUPABASE_EXPECTED_PROJECT_REF" = "sufvuqdnqohpfzkwxohq"
          test "$SUPABASE_EXPECTED_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          test "$GITHUB_REF_NAME" = "codex/tn09-raid-ranking-complete"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'NODE'
          const {readFile}=require("node:fs/promises");
          const assert=require("node:assert/strict");
          (async()=>{
            const projectRef=process.env.SUPABASE_EXPECTED_PROJECT_REF;
            const token=process.env.SUPABASE_ACCESS_TOKEN;
            async function query(sql){
              const response=await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query`,{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},body:JSON.stringify({query:sql})});
              if(!response.ok) throw new Error(`${response.status} ${await response.text()}`);
              return response.json();
            }
            const [pre]=await query("select exists(select 1 from supabase_migrations.schema_migrations where version='20260902000227') migration_227,exists(select 1 from supabase_migrations.schema_migrations where version='20260902000228') migration_228");
            assert.equal(pre.migration_227,true);
            if(!pre.migration_228){
              await query(await readFile(process.env.MIGRATION_FILE,"utf8"));
              await query("insert into supabase_migrations.schema_migrations(version,statements,name) values('20260902000228',array['TN-09 audited ranking lifecycle safety revert'],'ranking_season_lifecycle_revert') on conflict(version) do nothing");
            }
            await query(await readFile(process.env.POSTFLIGHT_FILE,"utf8"));
            await query(await readFile(process.env.FIXTURE_FILE,"utf8"));
            const [state]=await query("select exists(select 1 from supabase_migrations.schema_migrations where version='20260902000227') migration_227,exists(select 1 from supabase_migrations.schema_migrations where version='20260902000228') migration_228,(select count(*) from public.ranking_seasons where id in('90106a5f-ec9b-415f-98d0-754a525c1eb7','2828d27e-ebfd-4005-ba3b-0d618618c286') and status='ACTIVE') old_active,(select count(*) from public.ranking_seasons where id in('74bacb55-cad3-4c23-bca7-67a2aeac931d','e7f40125-3f35-4774-ad2d-839b213cc1fd')) new_rows");
            assert.deepEqual(state,{migration_227:true,migration_228:true,old_active:2,new_rows:0});
            console.log(JSON.stringify({projectRef,pre,postflight:"PASS",fixture:"PASS",state},null,2));
          })().catch(error=>{console.error(error instanceof Error?error.stack:error);process.exitCode=1;});
          NODE
