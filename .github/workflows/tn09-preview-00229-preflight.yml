name: TN-09 Preview ranking 00229 preflight

on:
  push:
    branches: [codex/tn09-raid-ranking-complete]
    paths:
      - .github/workflows/tn09-preview-00229-preflight.yml

permissions:
  contents: read

concurrency:
  group: tn09-preview-00229-preflight-sufvuqdnqohpfzkwxohq
  cancel-in-progress: false

jobs:
  inspect-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_EXPECTED_PROJECT_REF: sufvuqdnqohpfzkwxohq
      PRODUCTION_PROJECT_REF: ktpolnkyyfkowxdmijww
    steps:
      - uses: actions/checkout@v4
      - name: Guard exact Preview target and source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test "$SUPABASE_EXPECTED_PROJECT_REF" = "sufvuqdnqohpfzkwxohq"
          test "$SUPABASE_EXPECTED_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          test "$GITHUB_REF_NAME" = "codex/tn09-raid-ranking-complete"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Read-only PVP replay continuity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require("node:assert/strict");
          (async()=>{
            const projectRef=process.env.SUPABASE_EXPECTED_PROJECT_REF;
            const token=process.env.SUPABASE_ACCESS_TOKEN;
            assert.equal(projectRef,"sufvuqdnqohpfzkwxohq");
            assert.notEqual(projectRef,process.env.PRODUCTION_PROJECT_REF);
            const sql=`
              with events as (
                select replay.id replay_id,replay.requester_user_id user_id,
                  replay.source_reference_id opponent_user_id,replay.finalized_at,
                  replay.finalization_result->>'winner' winner,
                  (replay.finalization_result->>'oldRating')::integer declared_old_rating,
                  (replay.finalization_result->>'opponentRating')::integer opponent_rating,
                  (replay.finalization_result->>'rankDelta')::integer rank_delta,
                  (replay.finalization_result->>'newRankPoints')::integer new_rank_points,
                  row_number() over(partition by replay.requester_user_id order by replay.finalized_at,replay.id) event_no,
                  lag((replay.finalization_result->>'newRankPoints')::integer)
                    over(partition by replay.requester_user_id order by replay.finalized_at,replay.id) previous_new_rank
                from public.battle_replay_sessions replay
                where replay.battle_mode='PVP' and replay.finalization_status='FINALIZED'
                  and replay.finalized_at>='2026-08-31 15:00:00+00'
              ), per_user as (
                select event.user_id,count(*) event_count,
                  count(*) filter(where event.winner='PLAYER') win_count,
                  min(event.finalized_at) first_finalized_at,max(event.finalized_at) last_finalized_at,
                  max(event.new_rank_points) filter(where event.event_no=1) first_new_rank,
                  max(event.rank_delta) filter(where event.event_no=1) first_delta,
                  max(event.new_rank_points) filter(where event.finalized_at=(
                    select max(last_event.finalized_at) from events last_event where last_event.user_id=event.user_id
                  )) last_new_rank,
                  count(*) filter(where event.declared_old_rating is null or event.opponent_rating is null
                    or event.rank_delta is null or event.new_rank_points is null) incomplete_payloads,
                  count(*) filter(where event.event_no>1
                    and event.new_rank_points<>greatest(event.previous_new_rank+event.rank_delta,0)) discontinuities
                from events event group by event.user_id
              ), report as (
                select per_user.*,rank.rank_points current_rank_points,
                  rank.daily_wins current_daily_wins,rank.season_wins current_season_wins,rank.updated_at,
                  case when per_user.first_new_rank=0 then null
                    else per_user.first_new_rank-per_user.first_delta end inferred_boundary_rating,
                  rank.season_wins-per_user.win_count inferred_boundary_season_wins,
                  rank.daily_wins-per_user.win_count inferred_boundary_daily_wins,
                  (rank.rank_points<>per_user.last_new_rank) projection_mismatch,
                  (rank.updated_at>per_user.last_finalized_at) unexplained_later_rank_update
                from per_user join public.pvp_ranks rank on rank.user_id=per_user.user_id
              )
              select jsonb_build_object(
                'events',(select coalesce(jsonb_agg(to_jsonb(events) order by user_id,event_no),'[]'::jsonb) from events),
                'users',(select coalesce(jsonb_agg(to_jsonb(report) order by user_id),'[]'::jsonb) from report),
                'summary',jsonb_build_object(
                  'event_count',(select count(*) from events),
                  'user_count',(select count(*) from report),
                  'rank_rows_updated_after_boundary',(select count(*) from public.pvp_ranks where updated_at>='2026-08-31 15:00:00+00'),
                  'incomplete_payloads',(select coalesce(sum(incomplete_payloads),0) from report),
                  'discontinuities',(select coalesce(sum(discontinuities),0) from report),
                  'ambiguous_first_zero',(select count(*) from report where first_new_rank=0),
                  'projection_mismatches',(select count(*) from report where projection_mismatch),
                  'unexplained_later_updates',(select count(*) from report where unexplained_later_rank_update),
                  'negative_reconstructed_wins',(select count(*) from report where inferred_boundary_season_wins<0 or inferred_boundary_daily_wins<0),
                  'legacy_rpc_authenticated',coalesce(has_function_privilege('authenticated',to_regprocedure('public.update_pvp_result(boolean,integer)'),'execute'),false),
                  'direct_table_update_authenticated',has_table_privilege('authenticated','public.pvp_ranks','update'),
                  'duplicate_replay_ids',(select count(*)-count(distinct replay_id) from events),
                  'raid_logs_after_boundary',(select count(*) from public.raid_damage_logs where created_at>='2026-08-31 15:00:00+00'),
                  'raid_logs_without_timestamp',(select count(*) from public.raid_damage_logs where created_at is null)
                )
              ) result;
            `;
            const response=await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query`,{
              method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},
              body:JSON.stringify({query:sql})
            });
            if(!response.ok) throw new Error(`${response.status} ${await response.text()}`);
            console.log(JSON.stringify((await response.json())[0].result,null,2));
          })().catch(error=>{console.error(error instanceof Error?error.stack:error);process.exitCode=1;});
          NODE
