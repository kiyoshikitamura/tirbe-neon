name: TN-09 Preview ranking 00229 apply

on:
  push:
    branches: [codex/tn09-raid-ranking-complete]
    paths:
      - .github/workflows/tn09-preview-00229-preflight.yml

permissions:
  contents: read

concurrency:
  group: tn09-preview-00229-apply-sufvuqdnqohpfzkwxohq
  cancel-in-progress: false

jobs:
  apply-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_EXPECTED_PROJECT_REF: sufvuqdnqohpfzkwxohq
      PRODUCTION_PROJECT_REF: ktpolnkyyfkowxdmijww
      EXPECTED_CANDIDATE_SHA: d7e0847e81417549b429fa593a448a874c7208ba
      MIGRATION_VERSION: "20260902000229"
      MIGRATION_FILE: supabase/migrations/20260902000229_ranking_season_lifecycle_authority.sql
      POSTFLIGHT_FILE: supabase/postflight/20260902000229_ranking_season_lifecycle_authority_postflight.sql
      FIXTURE_FILE: tests/db/ranking-season-lifecycle-authority.sql
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_CANDIDATE_SHA }}
      - name: Guard exact Preview target and migration source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test "$SUPABASE_EXPECTED_PROJECT_REF" = "sufvuqdnqohpfzkwxohq"
          test "$SUPABASE_EXPECTED_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          test "$GITHUB_REF_NAME" = "codex/tn09-raid-ranking-complete"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
      - name: Apply register postflight and rollback fixture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {readFile}=require("node:fs/promises");
          const assert=require("node:assert/strict");
          (async()=>{
            const projectRef=process.env.SUPABASE_EXPECTED_PROJECT_REF;
            const token=process.env.SUPABASE_ACCESS_TOKEN;
            const version=process.env.MIGRATION_VERSION;
            assert.equal(projectRef,"sufvuqdnqohpfzkwxohq");
            assert.notEqual(projectRef,process.env.PRODUCTION_PROJECT_REF);
            async function query(sql){
              const response=await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query`,{
                method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},
                body:JSON.stringify({query:sql})
              });
              if(!response.ok) throw new Error(`${response.status} ${await response.text()}`);
              return response.json();
            }
            const [pre]=await query(`
              select
                exists(select 1 from supabase_migrations.schema_migrations where version='20260902000227') migration_227,
                exists(select 1 from supabase_migrations.schema_migrations where version='20260902000228') migration_228,
                exists(select 1 from supabase_migrations.schema_migrations where version='${version}') migration_229,
                (select count(*) from public.ranking_seasons where id in(
                  '90106a5f-ec9b-415f-98d0-754a525c1eb7'::uuid,
                  '2828d27e-ebfd-4005-ba3b-0d618618c286'::uuid
                ) and status='ACTIVE') old_active,
                (select count(*) from public.ranking_seasons where id in(
                  '74bacb55-cad3-4c23-bca7-67a2aeac931d'::uuid,
                  'e7f40125-3f35-4774-ad2d-839b213cc1fd'::uuid
                )) reverted_rows,
                (select count(*) from public.battle_replay_sessions where battle_mode='PVP'
                  and finalization_status='FINALIZED' and finalized_at>='2026-08-31 15:00:00+00') post_pvp_replays,
                (select count(distinct requester_user_id) from public.battle_replay_sessions where battle_mode='PVP'
                  and finalization_status='FINALIZED' and finalized_at>='2026-08-31 15:00:00+00') post_pvp_users,
                (select count(*) from public.raid_damage_logs where created_at>='2026-08-31 15:00:00+00') post_raid_logs;
            `);
            assert.deepEqual(pre,{migration_227:true,migration_228:true,migration_229:false,
              old_active:2,reverted_rows:0,post_pvp_replays:9,post_pvp_users:5,post_raid_logs:5});
            let migration=await readFile(process.env.MIGRATION_FILE,"utf8");
            const marker="commit;\nnotify pgrst,'reload schema';";
            assert.equal(migration.split(marker).length,2);
            migration=migration.replace(marker,`
              insert into supabase_migrations.schema_migrations(version,statements,name)
              values('${version}',array['TN-09 ranking season lifecycle authority'],'ranking_season_lifecycle_authority')
              on conflict(version) do nothing;
              commit;
              notify pgrst,'reload schema';`);
            await query(migration);
            await query(await readFile(process.env.POSTFLIGHT_FILE,"utf8"));
            await query(await readFile(process.env.FIXTURE_FILE,"utf8"));
            const [post]=await query(`
              select
                exists(select 1 from supabase_migrations.schema_migrations where version='${version}') migration_229,
                (select count(*) from public.ranking_season_transition_audits
                  where season_id='90106a5f-ec9b-415f-98d0-754a525c1eb7'::uuid and ranking_type='PVP'
                    and replay_count=9 and post_boundary_user_count=5
                    and expected_projection=after_projection) pvp_audit,
                (select count(*) from public.ranking_seasons where id in(
                  '90106a5f-ec9b-415f-98d0-754a525c1eb7'::uuid,
                  '2828d27e-ebfd-4005-ba3b-0d618618c286'::uuid
                ) and status='CLOSED') old_closed,
                (select count(*) from public.ranking_seasons where ranking_type in('PVP','RAID')
                  and status='ACTIVE' and clock_timestamp()>=starts_at and clock_timestamp()<ends_at) current_active,
                (select count(*) from public.raid_damage_logs log
                  join public.ranking_seasons season on season.ranking_type='RAID' and season.status='ACTIVE'
                  where log.created_at>=season.starts_at and log.created_at<season.ends_at) current_raid_logs,
                (select count(*) from public.ranking_season_reward_grants grant_row
                  join public.presents present on present.id=grant_row.present_id
                  where present.user_id=grant_row.recipient_user_id
                    and present.item_id=grant_row.resolved_item_id
                    and present.quantity=grant_row.quantity) linked_grants,
                (select count(*) from public.ranking_season_reward_grants) all_grants;
            `);
            assert.equal(post.migration_229,true);
            assert.equal(post.pvp_audit,1);
            assert.equal(post.old_closed,2);
            assert.equal(post.current_active,2);
            assert.equal(post.current_raid_logs,5);
            assert.equal(post.linked_grants,post.all_grants);
            console.log(JSON.stringify({projectRef,candidate:process.env.EXPECTED_CANDIDATE_SHA,pre,post,
              postflight:"PASS",rollbackFixture:"PASS"},null,2));
          })().catch(error=>{console.error(error instanceof Error?error.stack:error);process.exitCode=1;});
          NODE
