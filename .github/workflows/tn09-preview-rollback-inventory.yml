name: TN-09 Preview rollback inventory

on:
  push:
    branches: [codex/tn09-raid-ranking-complete]
    paths:
      - .github/workflows/tn09-preview-rollback-inventory.yml

permissions:
  contents: read

jobs:
  preview-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_EXPECTED_PROJECT_REF: sufvuqdnqohpfzkwxohq
      PRODUCTION_PROJECT_REF: ktpolnkyyfkowxdmijww
      APPLIED_AT: "2026-09-02T06:47:40Z"
    steps:
      - uses: actions/checkout@v4
      - name: Guard and inspect without mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test "$SUPABASE_EXPECTED_PROJECT_REF" = "sufvuqdnqohpfzkwxohq"
          test "$SUPABASE_EXPECTED_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          node <<'NODE'
          const assert=require("node:assert/strict");
          (async()=>{
            const projectRef=process.env.SUPABASE_EXPECTED_PROJECT_REF;
            const token=process.env.SUPABASE_ACCESS_TOKEN;
            async function query(sql){
              const response=await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query`,{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},body:JSON.stringify({query:sql})});
              if(!response.ok) throw new Error(`${response.status} ${await response.text()}`);
              return response.json();
            }
            const result=await query(`
              select jsonb_build_object(
                'migration_227',exists(select 1 from supabase_migrations.schema_migrations where version='20260902000227'),
                'seasons',(select coalesce(jsonb_agg(jsonb_build_object(
                  'id',s.id,'type',s.ranking_type,'starts_at',s.starts_at,'ends_at',s.ends_at,'status',s.status,
                  'created_at',s.created_at,'updated_at',s.updated_at,
                  'pvp_grants',(select count(*) from public.pvp_ranking_reward_grants g where g.season_id=s.id),
                  'gvg_guild_refs',(select count(*) from public.gvg_guild_season_rankings g where g.season_id=s.id),
                  'gvg_individual_refs',(select count(*) from public.gvg_individual_season_rankings g where g.season_id=s.id)
                ) order by s.ranking_type,s.starts_at),'[]'::jsonb) from public.ranking_seasons s where s.ranking_type in('PVP','RAID')),
                'fk_constraints',(select coalesce(jsonb_agg(jsonb_build_object('table',c.conrelid::regclass::text,'name',c.conname,'delete_action',c.confdeltype)),'[]'::jsonb) from pg_constraint c where c.contype='f' and c.confrelid='public.ranking_seasons'::regclass),
                'damage_after_apply',(select count(*) from public.raid_damage_logs where created_at>=${JSON.stringify(process.env.APPLIED_AT)}::timestamptz),
                'pvp_updates_after_apply',(select count(*) from public.pvp_ranks where updated_at>=${JSON.stringify(process.env.APPLIED_AT)}::timestamptz),
                'pvp_grants_after_apply',(select count(*) from public.pvp_ranking_reward_grants where granted_at>=${JSON.stringify(process.env.APPLIED_AT)}::timestamptz),
                'finalized_replays_after_apply',(select count(*) from public.battle_replay_sessions where finalized_at>=${JSON.stringify(process.env.APPLIED_AT)}::timestamptz)
              ) inventory;
            `);
            assert.equal(result.length,1);
            console.log(JSON.stringify({projectRef,readOnly:true,inventory:result[0].inventory},null,2));
          })().catch(error=>{console.error(error instanceof Error?error.stack:error);process.exitCode=1;});
          NODE
