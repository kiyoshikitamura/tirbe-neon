name: Targeted Acceptance Run 391

on:
  push:
    branches: [codex/targeted-acceptance-run391]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: targeted-acceptance-run391-wrapper
  cancel-in-progress: true

jobs:
  failed-cases-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_USE_MOCK_DB: "true"
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run only the two remaining cases through the bounded runner
        run: >-
          npm run test:e2e --
          tests/e2e/m9-tutorial.spec.ts
          tests/e2e/quest-natural-completion.spec.ts
          --workers=2
          --grep "first quest connects|normal Quest starts"
      - name: Upload focused diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-playwright-diagnostics
          path: |
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            playwright-report/index.html
          if-no-files-found: ignore
          retention-days: 1
