name: TN-02 Preview correction

on:
  push:
    branches: [codex/tn02-gacha-mission-authority]
    paths: [.github/workflows/tn02-preview-correction.yml]

permissions:
  contents: read
  statuses: write

concurrency:
  group: tn02-preview-correction-sufvuqdnqohpfzkwxohq
  cancel-in-progress: false

jobs:
  apply-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_EXPECTED_PROJECT_REF: sufvuqdnqohpfzkwxohq
      PRODUCTION_PROJECT_REF: ktpolnkyyfkowxdmijww
      MIGRATION_VERSION: "20260902000223"
      MIGRATION_FILE: supabase/migrations/20260902000223_daily_mission_authority_corrections.sql
      POSTFLIGHT_FILE: supabase/postflight/20260902000223_daily_mission_authority_corrections_postflight.sql
      FIXTURE_USER_ID: 00000000-0000-4000-8000-000000002223
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Guard exact Preview target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          test "$SUPABASE_EXPECTED_PROJECT_REF" = "sufvuqdnqohpfzkwxohq"
          test "$SUPABASE_EXPECTED_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          test "$GITHUB_REF_NAME" = "codex/tn02-gacha-mission-authority"

      - run: npm ci --ignore-scripts

      - name: Link exact Preview and confirm mutation guard
        env:
          SUPABASE_TELEMETRY_DISABLED: "1"
        run: |
          supabase link --project-ref "$SUPABASE_EXPECTED_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          node scripts/supabase_target_guard.mjs --environment preview --mutation

      - name: Preflight, apply correction once, and verify
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFile } = require("node:fs/promises");
          const assert = require("node:assert/strict");

          (async () => {
            const projectRef = process.env.SUPABASE_EXPECTED_PROJECT_REF;
            const productionRef = process.env.PRODUCTION_PROJECT_REF;
            const token = process.env.SUPABASE_ACCESS_TOKEN;
            const version = process.env.MIGRATION_VERSION;
            const fixture = process.env.FIXTURE_USER_ID;
            assert.equal(projectRef, "sufvuqdnqohpfzkwxohq");
            assert.notEqual(projectRef, productionRef);
            assert.ok(token);

            async function query(sql) {
              const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query`, {
                method: "POST",
                headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ query: sql }),
              });
              if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
              return response.json();
            }

            const [preflight] = await query(`
              select
                exists(select 1 from supabase_migrations.schema_migrations where version = '20260902000222') as predecessor_registered,
                exists(select 1 from supabase_migrations.schema_migrations where version = '${version}') as correction_registered,
                to_regprocedure('public.sync_current_missions()') is not null as sync_exists,
                to_regprocedure('public.refresh_daily_mission_completion_aggregates(uuid,date)') is not null as aggregate_exists,
                not exists(select 1 from public.users where id = '${fixture}') as fixture_available;
            `);
            for (const [key, value] of Object.entries(preflight)) {
              if (key !== "correction_registered") assert.equal(value, true, `preflight ${key} failed`);
            }

            if (!preflight.correction_registered) {
              await query(`
                insert into public.users(id, username) values ('${fixture}', 'TN02_FIX');
                insert into public.user_missions(user_id, mission_id, current_progress, progress_val, status, cycle_date)
                select '${fixture}', id, 0, 0, 'PROGRESS', (clock_timestamp() at time zone 'Asia/Tokyo')::date
                from public.missions
                where is_enabled and id in ('MIS_D_001', 'MIS_D_008', 'MIS_D_009');
                insert into public.gacha_execution_history(
                  user_id, request_id, gacha_id, payment_source, pull_count
                ) values (
                  '${fixture}', '00000000-0000-4000-8000-000000000023',
                  'CHAR_NORMAL', 'free', 10
                );
                update public.gacha_execution_history
                set status = 'COMPLETED', completed_at = clock_timestamp(), result_payload = '{}'::jsonb
                where user_id = '${fixture}';
                delete from public.user_daily_gacha_claims where user_id = '${fixture}';
                update public.user_missions
                set current_progress = 0, progress_val = 0, status = 'PROGRESS'
                where user_id = '${fixture}';
              `);
              await query(await readFile(process.env.MIGRATION_FILE, "utf8"));
              await query(`
                insert into supabase_migrations.schema_migrations(version, statements, name)
                values ('${version}', array['TN-02 daily mission authority corrections'], 'daily_mission_authority_corrections')
                on conflict (version) do nothing;
              `);
            }

            await query(await readFile(process.env.POSTFLIGHT_FILE, "utf8"));
            const [backfill] = await query(`
              select
                exists(
                  select 1 from public.user_daily_gacha_claims
                  where user_id = '${fixture}' and gacha_type = 'CHARACTER'
                    and last_claimed_date = (clock_timestamp() at time zone 'Asia/Tokyo')::date
                ) as claim_backfilled,
                exists(
                  select 1 from public.user_missions
                  where user_id = '${fixture}' and mission_id = 'MIS_D_001' and status = 'CLEAR'
                ) as mission_backfilled;
            `);
            if (!preflight.correction_registered) {
              assert.equal(backfill.claim_backfilled, true, "entitlement backfill failed");
              assert.equal(backfill.mission_backfilled, true, "mission backfill failed");
            }

            await query(`
              begin;
              insert into public.users(id, username)
              values ('00000000-0000-4000-8000-000000002224', 'TN02_ROLL');
              insert into public.user_missions(user_id, mission_id, current_progress, progress_val, status, cycle_date)
              select '00000000-0000-4000-8000-000000002224', id,
                case when id = 'MIS_D_008' then 3 else 1 end,
                case when id = 'MIS_D_008' then 3 else 1 end,
                'CLEAR', ((clock_timestamp() at time zone 'Asia/Tokyo')::date - 1)
              from public.missions where is_enabled and id in ('MIS_D_001', 'MIS_D_008', 'MIS_D_009');
              select set_config('request.jwt.claim.sub', '00000000-0000-4000-8000-000000002224', true);
              select public.sync_current_missions();
              do $fixture$
              begin
                if exists (
                  select 1 from public.user_missions
                  where user_id = '00000000-0000-4000-8000-000000002224'
                    and mission_id in ('MIS_D_001', 'MIS_D_008', 'MIS_D_009')
                    and (status <> 'PROGRESS'
                      or current_progress <> 0
                      or cycle_date <> (clock_timestamp() at time zone 'Asia/Tokyo')::date)
                ) then raise exception 'JST rollover reset failed'; end if;
              end;
              $fixture$;
              rollback;
            `);

            await query(`delete from public.users where id = '${fixture}';`);
            const [cleanup] = await query(`
              select
                not exists(select 1 from public.users where id in ('${fixture}', '00000000-0000-4000-8000-000000002224')) as users_cleaned,
                exists(select 1 from supabase_migrations.schema_migrations where version = '${version}') as correction_registered;
            `);
            assert.equal(cleanup.users_cleaned, true);
            assert.equal(cleanup.correction_registered, true);
            console.log(JSON.stringify({ projectRef, version, preflight, backfill, rollover: "PASS", cleanup }, null, 2));
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack : error);
            process.exitCode = 1;
          });
          NODE

      - name: Cleanup fixture after failure
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          (async () => {
            const projectRef = process.env.SUPABASE_EXPECTED_PROJECT_REF;
            assert.equal(projectRef, "sufvuqdnqohpfzkwxohq");
            assert.notEqual(projectRef, process.env.PRODUCTION_PROJECT_REF);
            const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query`, {
              method: "POST",
              headers: { Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, "Content-Type": "application/json" },
              body: JSON.stringify({ query: `delete from public.users where id in ('${process.env.FIXTURE_USER_ID}', '00000000-0000-4000-8000-000000002224');` }),
            });
            if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack : error);
            process.exitCode = 1;
          });
          NODE
