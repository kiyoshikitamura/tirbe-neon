name: TN-02 Preview migration

on:
  push:
    branches:
      - codex/tn02-gacha-mission-authority
    paths:
      - .github/workflows/tn02-preview-migration.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: tn02-preview-migration-sufvuqdnqohpfzkwxohq
  cancel-in-progress: false

jobs:
  apply-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PREVIEW_PROJECT_REF: sufvuqdnqohpfzkwxohq
      SUPABASE_EXPECTED_PROJECT_REF: sufvuqdnqohpfzkwxohq
      PRODUCTION_PROJECT_REF: ktpolnkyyfkowxdmijww
      MIGRATION_VERSION: "20260902000222"
      MIGRATION_FILE: supabase/migrations/20260902000222_daily_mission_authority_convergence.sql
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Guard secrets, branch, and exact Preview target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "SUPABASE_DB_PASSWORD is missing"; exit 1; }
          test "$SUPABASE_PREVIEW_PROJECT_REF" = "sufvuqdnqohpfzkwxohq"
          test "$SUPABASE_EXPECTED_PROJECT_REF" = "sufvuqdnqohpfzkwxohq"
          test "$SUPABASE_EXPECTED_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          test "$GITHUB_REF_NAME" = "codex/tn02-gacha-mission-authority"

      - name: Publish guarded migration pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"pending\",\"context\":\"tn02-preview-migration\",\"description\":\"Guarded TN-02 Preview migration is running\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"

      - run: npm ci --ignore-scripts

      - name: Link exact Preview project
        env:
          SUPABASE_TELEMETRY_DISABLED: "1"
        run: |
          supabase link \
            --project-ref "$SUPABASE_EXPECTED_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Confirm guarded Preview mutation
        run: node scripts/supabase_target_guard.mjs --environment preview --mutation

      - name: Preflight, apply 00222 once, postflight, and rollback fixture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFile } = require("node:fs/promises");
          const assert = require("node:assert/strict");

          (async () => {
            const previewRef = process.env.SUPABASE_EXPECTED_PROJECT_REF;
            const productionRef = process.env.PRODUCTION_PROJECT_REF;
            const token = process.env.SUPABASE_ACCESS_TOKEN;
            const version = process.env.MIGRATION_VERSION;
            const migrationFile = process.env.MIGRATION_FILE;
            assert.equal(previewRef, "sufvuqdnqohpfzkwxohq");
            assert.notEqual(previewRef, productionRef);
            assert.ok(token);

            async function query(sql) {
              assert.equal(typeof sql, "string");
              assert.ok(sql.trim().length > 0);
              const response = await fetch(`https://api.supabase.com/v1/projects/${previewRef}/database/query`, {
                method: "POST",
                headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ query: sql }),
              });
              if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
              return response.json();
            }

            const [preflight] = await query(`
              select
                exists(select 1 from supabase_migrations.schema_migrations where version = '20260902000221') as tn01_registered,
                exists(select 1 from supabase_migrations.schema_migrations where version = '${version}') as migration_registered,
                to_regclass('public.gacha_execution_history') is not null as gacha_history_exists,
                to_regclass('public.user_daily_gacha_claims') is not null as daily_claims_exists,
                to_regclass('public.user_missions') is not null as user_missions_exists,
                to_regclass('public.board_posts') is not null as board_posts_exists,
                to_regprocedure('public.evaluate_mission_progress(uuid,text,integer)') is not null as evaluator_exists;
            `);
            for (const [key, value] of Object.entries(preflight)) {
              if (key !== "migration_registered") assert.equal(value, true, `preflight ${key} failed`);
            }
            console.log(JSON.stringify({ stage: "preflight", project_ref: previewRef, version, ...preflight }, null, 2));

            if (!preflight.migration_registered) {
              await query(await readFile(migrationFile, "utf8"));
              await query(`
                insert into supabase_migrations.schema_migrations(version, statements, name)
                values (
                  '${version}',
                  array['TN-02 free gacha and daily mission authority convergence'],
                  'daily_mission_authority_convergence'
                )
                on conflict (version) do nothing;
              `);
              console.log(`Applied and registered migration ${version} on Preview ${previewRef}.`);
            } else {
              console.log(`Migration ${version} was already registered; mutation skipped.`);
            }

            const [contract] = await query(`
              select
                exists(select 1 from supabase_migrations.schema_migrations where version = '${version}') as migration_registered,
                to_regprocedure('public.consume_tutorial_character_daily_free_gacha()') is not null as tutorial_consumer_exists,
                to_regprocedure('public.dispatch_completed_free_normal_gacha_mission()') is not null as gacha_dispatch_exists,
                to_regprocedure('public.dispatch_guild_chat_mission()') is not null as guild_dispatch_exists,
                to_regprocedure('public.refresh_daily_mission_completion_aggregates(uuid,date)') is not null as daily_aggregate_exists,
                exists(select 1 from pg_trigger where tgname = 'consume_tutorial_character_daily_free_gacha_trigger' and not tgisinternal) as tutorial_trigger_exists,
                exists(select 1 from pg_trigger where tgname = 'dispatch_completed_free_normal_gacha_mission_trigger' and not tgisinternal) as gacha_trigger_exists,
                exists(select 1 from pg_trigger where tgname = 'dispatch_guild_chat_mission_trigger' and not tgisinternal) as guild_trigger_exists,
                exists(select 1 from pg_trigger where tgname = 'daily_mission_authority_change_trigger' and not tgisinternal) as aggregate_trigger_exists,
                (select title = 'ギルドで発言しよう' from public.missions where id = 'MIS_D_006') as guild_copy_matches,
                (select count(*) = 1 from public.canonical_master_freeze_versions where domain = 'MISSION' and is_production_enabled) as one_active_mission_version,
                exists(select 1 from public.canonical_master_freeze_versions where domain = 'MISSION' and version = '2026-09-02' and is_production_enabled) as mission_version_active,
                position('PVP_FINALIZED_BATTLE_COUNT' in pg_get_functiondef('public.evaluate_mission_progress(uuid,text,integer)'::regprocedure)) > 0 as pvp_alias_present,
                position('GUILD_ACTIVITY_COUNT' in pg_get_functiondef('public.evaluate_mission_progress(uuid,text,integer)'::regprocedure)) > 0 as guild_alias_present;
            `);
            for (const [key, value] of Object.entries(contract)) assert.equal(value, true, `postflight ${key} failed`);
            console.log(JSON.stringify({ stage: "postflight", project_ref: previewRef, version, ...contract }, null, 2));

            await query(`
              begin;
              insert into public.users(id, username)
              values ('00000000-0000-4000-8000-000000002222', 'TN02_QA');
              insert into public.tutorial_progress(user_id, step_id)
              values ('00000000-0000-4000-8000-000000002222', 'FREE_GACHA');
              insert into public.user_missions(user_id, mission_id, current_progress, progress_val, status, cycle_date)
              select '00000000-0000-4000-8000-000000002222', id, 0, 0, 'PROGRESS', (clock_timestamp() at time zone 'Asia/Tokyo')::date
              from public.missions where id in ('MIS_D_001', 'MIS_D_004', 'MIS_D_006', 'MIS_D_008', 'MIS_D_009');
              insert into public.gacha_execution_history(user_id, request_id, gacha_id, payment_source, pull_count)
              values ('00000000-0000-4000-8000-000000002222', '00000000-0000-4000-8000-000000000001', 'CHAR_NORMAL', 'free', 10);
              update public.gacha_execution_history
              set status = 'COMPLETED', completed_at = clock_timestamp(), result_payload = '{"status":"success"}'::jsonb
              where user_id = '00000000-0000-4000-8000-000000002222'
                and request_id = '00000000-0000-4000-8000-000000000001';
              do $fixture$
              begin
                begin
                  insert into public.gacha_execution_history(user_id, request_id, gacha_id, payment_source, pull_count)
                  values ('00000000-0000-4000-8000-000000002222', '00000000-0000-4000-8000-000000000002', 'CHAR_NORMAL', 'free', 10);
                  raise exception 'second same-day tutorial free draw unexpectedly succeeded';
                exception when unique_violation then
                  null;
                end;
              end;
              $fixture$;
              select public.evaluate_mission_progress('00000000-0000-4000-8000-000000002222', 'PVP_BATTLE_COUNT', 1);
              insert into public.board_posts(title, content, author_id, user_id, author_name, target_type, is_system)
              values ('', 'TN02 rollback Guild fixture', '00000000-0000-4000-8000-000000002222', '00000000-0000-4000-8000-000000002222', 'TN02_QA', 'GUILD', false);
              do $fixture$
              begin
                if not exists (
                  select 1 from public.user_daily_gacha_claims
                  where user_id = '00000000-0000-4000-8000-000000002222'
                    and gacha_type = 'CHARACTER'
                    and last_claimed_date = (clock_timestamp() at time zone 'Asia/Tokyo')::date
                ) then raise exception 'tutorial free entitlement was not consumed'; end if;
                if exists (
                  select 1 from public.user_missions
                  where user_id = '00000000-0000-4000-8000-000000002222'
                    and mission_id in ('MIS_D_001', 'MIS_D_004', 'MIS_D_006', 'MIS_D_008')
                    and status <> 'CLEAR'
                ) then raise exception 'TN-02 fixture mission did not clear'; end if;
                if not exists (
                  select 1 from public.user_missions
                  where user_id = '00000000-0000-4000-8000-000000002222'
                    and mission_id = 'MIS_D_009' and status = 'PROGRESS' and current_progress = 3
                ) then raise exception 'Daily five aggregate fixture mismatch'; end if;
              end;
              $fixture$;
              rollback;
            `);
            const [cleanup] = await query(`
              select not exists(
                select 1 from public.users where id = '00000000-0000-4000-8000-000000002222'
              ) as fixture_cleaned;
            `);
            assert.equal(cleanup.fixture_cleaned, true, "rollback fixture was not cleaned");
            console.log(JSON.stringify({ stage: "rollback-fixture", fixture_cleaned: true }, null, 2));
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack : error);
            process.exitCode = 1;
          });
          NODE

      - name: Publish guarded migration result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="failure"
          description="Guarded TN-02 Preview migration failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="00222 applied and verified on Preview"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"$state\",\"context\":\"tn02-preview-migration\",\"description\":\"$description\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
