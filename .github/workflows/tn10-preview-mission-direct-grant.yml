name: TN-10 Preview mission direct grant

on:
  push:
    branches: [codex/tn10-mission-direct-grant]
    paths:
      - .github/workflows/tn10-preview-mission-direct-grant.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: tn10-preview-mission-direct-grant-sufvuqdnqohpfzkwxohq
  cancel-in-progress: false

jobs:
  apply-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_EXPECTED_PROJECT_REF: sufvuqdnqohpfzkwxohq
      PRODUCTION_PROJECT_REF: ktpolnkyyfkowxdmijww
      MIGRATION_VERSION: "20260902000225"
      MIGRATION_FILE: supabase/migrations/20260902000225_mission_direct_grant_refresh.sql
      POSTFLIGHT_FILE: supabase/postflight/20260902000225_mission_direct_grant_refresh_postflight.sql
      FIXTURE_FILE: tests/db/mission-direct-grant.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard exact Preview target and source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test "$SUPABASE_EXPECTED_PROJECT_REF" = "sufvuqdnqohpfzkwxohq"
          test "$SUPABASE_EXPECTED_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          test "$GITHUB_REF_NAME" = "codex/tn10-mission-direct-grant"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Preflight, apply once, postflight, and roll back fixture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFile } = require("node:fs/promises");
          const assert = require("node:assert/strict");

          (async () => {
            const projectRef = process.env.SUPABASE_EXPECTED_PROJECT_REF;
            const productionRef = process.env.PRODUCTION_PROJECT_REF;
            const token = process.env.SUPABASE_ACCESS_TOKEN;
            const version = process.env.MIGRATION_VERSION;
            assert.equal(projectRef, "sufvuqdnqohpfzkwxohq");
            assert.notEqual(projectRef, productionRef);
            assert.ok(token);

            async function query(sql) {
              const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query`, {
                method: "POST",
                headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ query: sql }),
              });
              if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
              return response.json();
            }

            const [preflight] = await query(`
              select
                exists(select 1 from supabase_migrations.schema_migrations where version='20260902000221') as migration_221,
                exists(select 1 from supabase_migrations.schema_migrations where version='20260902000222') as migration_222,
                exists(select 1 from supabase_migrations.schema_migrations where version='20260902000223') as migration_223,
                exists(select 1 from supabase_migrations.schema_migrations where version='20260902000224') as migration_224,
                exists(select 1 from supabase_migrations.schema_migrations where version='${version}') as migration_225;
            `);
            for (const key of ["migration_221","migration_222","migration_223","migration_224"]) {
              assert.equal(preflight[key], true, `preflight ${key} missing`);
            }

            if (!preflight.migration_225) {
              await query(await readFile(process.env.MIGRATION_FILE, "utf8"));
              await query(`
                insert into supabase_migrations.schema_migrations(version,statements,name)
                values('${version}',array['TN-10 mission direct grant and refresh'],'mission_direct_grant_refresh')
                on conflict(version) do nothing;
              `);
            }

            await query(await readFile(process.env.POSTFLIGHT_FILE, "utf8"));
            await query(await readFile(process.env.FIXTURE_FILE, "utf8"));

            const [cleanup] = await query(`
              select
                exists(select 1 from supabase_migrations.schema_migrations where version='${version}') as migration_registered,
                not exists(
                  select 1 from public.users
                  where id in (
                    '25000000-0000-4000-8000-000000000001',
                    '25000000-0000-4000-8000-000000000002'
                  )
                ) as fixture_rolled_back;
            `);
            assert.equal(cleanup.migration_registered, true);
            assert.equal(cleanup.fixture_rolled_back, true);
            console.log(JSON.stringify({ projectRef, version, preflight, postflight: "PASS", fixture: "PASS", cleanup }, null, 2));
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack : error);
            process.exitCode = 1;
          });
          NODE
