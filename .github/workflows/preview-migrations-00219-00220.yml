name: Preview migrations 00219-00220 (one-time)

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/preview-migrations-00219-00220.yml

permissions:
  contents: read

concurrency:
  group: preview-migrations-00219-00220
  cancel-in-progress: false

jobs:
  apply-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_EXPECTED_PROJECT_REF: sufvuqdnqohpfzkwxohq
      SUPABASE_PREVIEW_PROJECT_REF: sufvuqdnqohpfzkwxohq
      PREVIEW_REF: sufvuqdnqohpfzkwxohq
      PRODUCTION_REF: ktpolnkyyfkowxdmijww
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Guard secrets and target
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN is missing}"
          : "${SUPABASE_DB_PASSWORD:?SUPABASE_DB_PASSWORD is missing}"
          test "${PREVIEW_REF}" = "sufvuqdnqohpfzkwxohq"
          test "${SUPABASE_EXPECTED_PROJECT_REF}" = "${PREVIEW_REF}"
          test "${SUPABASE_PREVIEW_PROJECT_REF}" = "${PREVIEW_REF}"
          test "${PREVIEW_REF}" != "${PRODUCTION_REF}"

      - name: Link guarded Preview project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "${PREVIEW_REF}" --password "${SUPABASE_DB_PASSWORD}"
          node scripts/supabase_target_guard.mjs --environment preview --mutation

      - name: Read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/postflight
          cat > supabase/postflight/preflight_00219_00220.sql <<'SQL'
          select version, name
          from supabase_migrations.schema_migrations
          where version >= '20260830000000'
          order by version;

          select (
            not exists (
              select 1 from supabase_migrations.schema_migrations
              where version in ('20260901000219','20260901000220')
            )
            and not exists (
              select 1 from information_schema.columns
              where table_schema = 'public'
                and table_name = 'tutorial_progress'
                and column_name = 'authentication_pending'
            )
            and to_regprocedure('public.defer_tutorial_authentication()') is null
            and to_regprocedure('public.record_post_tutorial_guide_milestone(uuid,text,jsonb)') is null
            and to_regprocedure('public.complete_tutorial_authentication(text)') is not null
            and to_regprocedure('public.get_current_onboarding_state()') is not null
            and to_regprocedure('public.save_main_formation(text[])') is not null
            and to_regprocedure('public.calculate_user_character_power(uuid,uuid)') is not null
            and to_regprocedure('public.refresh_user_power_projection(uuid)') is not null
          ) as all_ok
          \gset
          \if :all_ok
            \echo 'Preview preflight verified.'
          \else
            \echo 'Preview preflight rejected the migration.'
            \quit 1
          \endif
          SQL
          node scripts/run_guarded_postflight.mjs \
            --environment preview \
            --file supabase/postflight/preflight_00219_00220.sql

      - name: Apply and register 00219
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run_guarded_migration_file.mjs \
            --environment preview \
            --file supabase/migrations/20260901000219_optional_account_authentication.sql
          supabase migration repair 20260901000219 \
            --status applied \
            --linked \
            --password "${SUPABASE_DB_PASSWORD}"

      - name: Apply and register 00220
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run_guarded_migration_file.mjs \
            --environment preview \
            --file supabase/migrations/20260901000220_post_tutorial_loadout_guide.sql
          supabase migration repair 20260901000220 \
            --status applied \
            --linked \
            --password "${SUPABASE_DB_PASSWORD}"

      - name: Read-only postflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/postflight
          cat > supabase/postflight/verify_00219_00220.sql <<'SQL'
          select (
            (select count(*) from supabase_migrations.schema_migrations
              where version in ('20260901000219','20260901000220')) = 2
            and exists (
              select 1 from information_schema.columns
              where table_schema = 'public'
                and table_name = 'tutorial_progress'
                and column_name = 'authentication_pending'
            )
            and to_regprocedure('public.defer_tutorial_authentication()') is not null
            and to_regprocedure('public.save_recommended_main_formation()') is not null
            and to_regprocedure('public.apply_recommended_main_loadout()') is not null
          ) as all_ok
          \gset
          \if :all_ok
            \echo 'Preview migrations 00219 and 00220 verified.'
          \else
            \echo 'Preview migration postflight failed.'
            \quit 1
          \endif
          SQL
          node scripts/run_guarded_postflight.mjs             --environment preview             --file supabase/postflight/verify_00219_00220.sql
