name: TN-09 Preview ranking 00230 safety convergence

on:
  push:
    branches: [codex/tn09-raid-ranking-complete]
    paths:
      - .github/workflows/tn09-preview-00230-safety-convergence.yml

permissions:
  contents: read

concurrency:
  group: tn09-preview-00230-sufvuqdnqohpfzkwxohq
  cancel-in-progress: false

jobs:
  apply-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_EXPECTED_PROJECT_REF: sufvuqdnqohpfzkwxohq
      PRODUCTION_PROJECT_REF: ktpolnkyyfkowxdmijww
      EXPECTED_CANDIDATE_SHA: 032a623bd3acc17cc8ef5f9bef7a6a77a42a079f
      MIGRATION_VERSION: "20260902000230"
      MIGRATION_FILE: supabase/migrations/20260902000230_ranking_lifecycle_safety_convergence.sql
      POSTFLIGHT_FILE: supabase/postflight/20260902000230_ranking_lifecycle_safety_convergence_postflight.sql
      FIXTURE_FILE: tests/db/ranking-lifecycle-safety-convergence.sql
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_CANDIDATE_SHA }}
      - name: Guard exact Preview target and migration source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test "$SUPABASE_EXPECTED_PROJECT_REF" = "sufvuqdnqohpfzkwxohq"
          test "$SUPABASE_EXPECTED_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          test "$GITHUB_REF_NAME" = "codex/tn09-raid-ranking-complete"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
      - name: Apply register postflight and rollback fixture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {readFile}=require("node:fs/promises");
          const assert=require("node:assert/strict");
          (async()=>{
            const projectRef=process.env.SUPABASE_EXPECTED_PROJECT_REF;
            const token=process.env.SUPABASE_ACCESS_TOKEN;
            const version=process.env.MIGRATION_VERSION;
            assert.equal(projectRef,"sufvuqdnqohpfzkwxohq");
            assert.notEqual(projectRef,process.env.PRODUCTION_PROJECT_REF);
            async function query(sql){
              const response=await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query`,{
                method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},
                body:JSON.stringify({query:sql})
              });
              if(!response.ok) throw new Error(`${response.status} ${await response.text()}`);
              return response.json();
            }
            const inventorySql=`
              select
                exists(select 1 from supabase_migrations.schema_migrations where version='20260902000227') migration_227,
                exists(select 1 from supabase_migrations.schema_migrations where version='20260902000228') migration_228,
                exists(select 1 from supabase_migrations.schema_migrations where version='20260902000229') migration_229,
                exists(select 1 from supabase_migrations.schema_migrations where version='${version}') migration_230,
                (select count(*) from public.ranking_season_transition_audits
                  where season_id='90106a5f-ec9b-415f-98d0-754a525c1eb7'::uuid and ranking_type='PVP'
                    and replay_count=9 and post_boundary_user_count=5
                    and expected_projection=after_projection) pvp_audit,
                (select coalesce(jsonb_agg(to_jsonb(rank_row) order by rank_row.user_id),'[]'::jsonb)
                  from public.pvp_ranks rank_row) pvp_projection,
                (select count(*) from public.ranking_seasons where id in(
                  '90106a5f-ec9b-415f-98d0-754a525c1eb7'::uuid,
                  '2828d27e-ebfd-4005-ba3b-0d618618c286'::uuid
                ) and status='CLOSED') old_closed,
                (select starts_at from public.ranking_seasons
                  where id='e7f40125-3f35-4774-ad2d-839b213cc1fd'::uuid and status='ACTIVE') raid_starts_at,
                (select ends_at from public.ranking_seasons
                  where id='e7f40125-3f35-4774-ad2d-839b213cc1fd'::uuid and status='ACTIVE') raid_ends_at,
                (select count(*) from public.raid_damage_logs
                  where created_at>='2026-08-30 15:00:00+00' and created_at<'2026-08-31 15:00:00+00') overlap_raid_logs,
                (select count(*) from public.raid_damage_logs
                  where created_at>='2026-08-31 15:00:00+00' and created_at<'2026-09-06 15:00:00+00') current_raid_logs,
                (select count(*) from public.ranking_season_reward_grants) grants,
                (select count(*) from public.ranking_season_reward_grants grant_row
                  join public.presents present on present.id=grant_row.present_id
                  where present.user_id=grant_row.recipient_user_id
                    and present.item_id=grant_row.resolved_item_id
                    and present.quantity=grant_row.quantity) linked_presents;
            `;
            const [pre]=await query(inventorySql);
            assert.equal(pre.migration_227,true);
            assert.equal(pre.migration_228,true);
            assert.equal(pre.migration_229,true);
            assert.equal(pre.migration_230,false);
            assert.equal(pre.pvp_audit,1);
            assert.equal(pre.old_closed,2);
            assert.equal(pre.raid_starts_at,"2026-08-30T15:00:00+00:00");
            assert.equal(pre.raid_ends_at,"2026-09-06T15:00:00+00:00");
            assert.equal(pre.overlap_raid_logs,0);
            assert.equal(pre.current_raid_logs,5);
            assert.equal(pre.grants,11);
            assert.equal(pre.linked_presents,11);

            let migration=await readFile(process.env.MIGRATION_FILE,"utf8");
            const marker="commit;\nnotify pgrst,'reload schema';";
            assert.equal(migration.split(marker).length,2);
            migration=migration.replace(marker,`
              insert into supabase_migrations.schema_migrations(version,statements,name)
              values('${version}',array['TN-09 ranking lifecycle safety convergence'],'ranking_lifecycle_safety_convergence')
              on conflict(version) do nothing;
              commit;
              notify pgrst,'reload schema';`);
            await query(migration);
            await query(await readFile(process.env.POSTFLIGHT_FILE,"utf8"));
            await query(await readFile(process.env.FIXTURE_FILE,"utf8"));
            const [post]=await query(inventorySql);
            assert.equal(post.migration_230,true);
            assert.equal(post.pvp_audit,pre.pvp_audit);
            assert.deepEqual(post.pvp_projection,pre.pvp_projection);
            assert.equal(post.old_closed,pre.old_closed);
            assert.equal(post.raid_starts_at,"2026-08-31T15:00:00+00:00");
            assert.equal(post.raid_ends_at,pre.raid_ends_at);
            assert.equal(post.overlap_raid_logs,0);
            assert.equal(post.current_raid_logs,pre.current_raid_logs);
            assert.equal(post.grants,pre.grants);
            assert.equal(post.linked_presents,pre.linked_presents);
            console.log(JSON.stringify({projectRef,candidate:process.env.EXPECTED_CANDIDATE_SHA,
              pre:{...pre,pvp_projection:`${pre.pvp_projection.length} rows`},
              post:{...post,pvp_projection:`${post.pvp_projection.length} rows`},
              postflight:"PASS",rollbackFixture:"PASS",productionImpact:0},null,2));
          })().catch(error=>{console.error(error instanceof Error?error.stack:error);process.exitCode=1;});
          NODE
