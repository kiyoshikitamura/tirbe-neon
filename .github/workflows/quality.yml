name: Quality

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_USE_MOCK_DB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:mock-asset-gacha
      - run: npm run verify:mock-direct-message-read
      - run: npm run verify:mock-gvg-cancellation
      - run: npm run build

  edge-function-check:
    runs-on: ubuntu-latest
    env:
      DENO_DIR: .deno
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: .deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts', 'deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - name: Check Edge Function with dependency retry
        run: |
          for attempt in 1 2 3 4 5; do
            deno check supabase/functions/resolve-battle/index.ts && exit 0
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 10))
              echo "Deno dependency check failed; retrying in ${delay}s ($attempt/5)..."
              sleep "$delay"
            fi
          done
          exit 1
      - run: deno test supabase/functions/resolve-battle/engine_test.ts

  browser-e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_USE_MOCK_DB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
